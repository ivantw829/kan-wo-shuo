<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="在很吵、不能出聲、或說不出話的時候，打字後用全螢幕黑底黃字大字給對方看。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="看我說">
<meta name="application-name" content="看我說">
<meta property="og:type" content="website">
<meta property="og:title" content="看我說">
<meta property="og:description" content="在很吵、不能出聲、或說不出話的時候，打字後用全螢幕黑底黃字大字給對方看。">
<meta property="og:url" content="https://ivantw829.github.io/kan-wo-shuo/">
<meta property="og:image" content="https://ivantw829.github.io/kan-wo-shuo/icons/icon-512.png">
<meta property="og:locale" content="zh_TW">
<title>看我說</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 備用楷體：裝置上沒有標楷體時（例如 iPhone / Android）使用霞鶩文楷。
     media="print" 再切回 all：不擋首次繪製；crossorigin：讓 service worker 拿到的不是 opaque 回應 -->
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet"
      crossorigin media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet" crossorigin></noscript>
<style>
  :root {
    --fg: #FFD500;
    --fg-dim: rgba(255, 213, 0, .55);
    --fg-faint: rgba(255, 213, 0, .18);
    --bg: #000;
    --kai: "BiauKai", "標楷體", "DFKai-SB", "Kaiti TC", "TW-Kai", "STKaiti", "KaiTi", "LXGW WenKai TC", serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: var(--kai);
    -webkit-tap-highlight-color: transparent;
  }
  body { overscroll-behavior: none; }

  /* ---------- 輸入畫面 ---------- */
  #editor {
    display: flex; flex-direction: column; gap: 12px;
    height: 100dvh; min-height: 100%;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  #input {
    flex: 1 1 auto; min-height: 120px; width: 100%;
    resize: none;
    background: #0a0a0a; color: var(--fg);
    border: 2px solid var(--fg-dim); border-radius: 14px;
    padding: 14px 16px;
    font: 700 clamp(24px, 4.5vw, 40px)/1.4 var(--kai);
    caret-color: var(--fg);
    outline: none;
  }
  #input:focus { border-color: var(--fg); }
  #input::placeholder { color: var(--fg-dim); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font: 700 20px/1 var(--kai);
    color: var(--fg); background: transparent;
    border: 2px solid var(--fg-dim); border-radius: 12px;
    padding: 12px 16px; cursor: pointer;
    touch-action: manipulation;
  }
  button:active { background: var(--fg-faint); }
  #showBtn {
    flex: 1 1 auto;
    background: var(--fg); color: #000; border-color: var(--fg);
    font-size: 22px; padding: 14px;
  }
  #showBtn:active { filter: brightness(.85); }
  button.on { background: var(--fg-faint); border-color: var(--fg); }

  .label { font-size: 16px; color: var(--fg-dim); margin: 2px 0 -4px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline; }
  .label button { position: relative; font-size: 15px; padding: 4px 10px; border-width: 1px; }
  /* 視覺上維持小按鈕，點擊熱區擴大到約 44px */
  .label button::after { content: ''; position: absolute; inset: -10px -8px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; position: relative;
    display: inline-flex; align-items: center;
    font-size: 22px; padding: 10px 14px;
    max-width: 70vw;
  }
  /* ellipsis 只套在文字上，管理模式的 × 不會被截掉 */
  .chip .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .x {
    display: none; flex: 0 0 auto; position: relative; margin-left: 8px; color: #000; background: var(--fg);
    border-radius: 50%; width: 22px; height: 22px; line-height: 22px;
    font-size: 16px; text-align: center;
  }
  /* 點擊熱區擴大到約 36px */
  .chip .x::after { content: ''; position: absolute; inset: -7px; }
  .managing .chip .x { display: inline-block; }
  .managing .chips { flex-wrap: wrap; overflow: visible; }
  .managing .chip { touch-action: none; cursor: grab; border-style: dashed; }
  .chip.dragging { background: var(--fg); color: #000; border-style: solid; transform: scale(1.06); cursor: grabbing; z-index: 2; }
  .chip.dragging .x { background: #000; color: var(--fg); }
  .empty { color: var(--fg-dim); font-size: 17px; padding: 10px 0; }
  .hint { font-size: 14px; color: var(--fg-dim); text-align: center; }
  /* 只對鍵盤／只對觸控顯示的說明 */
  @media (hover: none) { .kb { display: none; } }
  @media (hover: hover) { .touch { display: none; } }

  /* 管理模式才出現的匯出／匯入 */
  .label .tools { display: flex; gap: 18px; margin-left: auto; }
  .label .mgmt { display: none; }
  .managing .label .mgmt { display: inline-block; }

  /* 提示列：刪除後可復原、匯入結果 */
  #toast {
    /* left/right + margin auto 置中：用 left:50% 的話寬度會被限制在半個畫面 */
    position: fixed; left: 0; right: 0; z-index: 5;
    bottom: max(16px, env(safe-area-inset-bottom));
    margin: 0 auto; width: max-content;
    display: none; align-items: center; gap: 12px;
    max-width: calc(100vw - 32px);
    padding: 8px 8px 8px 16px;
    background: var(--bg); border: 2px solid var(--fg); border-radius: 12px;
    font-size: 18px;
  }
  #toast.on { display: flex; }
  #toastMsg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toastUndo { flex: 0 0 auto; font-size: 18px; padding: 8px 14px; background: var(--fg); color: #000; border-color: var(--fg); }

  /* ---------- 全螢幕顯示 ---------- */
  #display {
    position: fixed; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    background: var(--bg);
    cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #display.show { display: flex; }
  /* 字已經縮到最小還放不下（極長的文字）：允許捲動，不要切掉 */
  #display.overflow { overflow: auto; align-items: flex-start; }
  #display:focus { outline: none; }
  #display.flip #text { transform: rotate(180deg); }
  #text {
    margin: 0;
    font-family: var(--kai); font-weight: 700;
    line-height: 1.22;
    text-align: center;
    white-space: pre-wrap;
    overflow-wrap: normal;
    word-break: normal;
    line-break: strict;
  }
  #tapHint {
    position: absolute; left: 0; right: 0;
    bottom: max(12px, env(safe-area-inset-bottom));
    text-align: center; font-size: 16px; color: var(--fg-dim);
    transition: opacity .6s; pointer-events: none;
  }
  #tapHint.gone { opacity: 0; }
</style>
</head>
<body>

<main id="editor">
  <textarea id="input" placeholder="在這裡打字，按 Enter 全螢幕" autofocus
            autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></textarea>

  <div class="row">
    <button id="showBtn" type="button">全螢幕 ⤢</button>
    <button id="clearBtn" type="button">清除</button>
    <button id="saveBtn" type="button">＋常用</button>
    <button id="sizeBtn" type="button" title="全螢幕文字的最大字級">字級：中</button>
    <button id="flipBtn" type="button" title="把文字倒過來，給對面的人看" aria-pressed="false">翻轉</button>
  </div>

  <div id="phraseWrap">
    <div class="label">
      <span id="phraseLabel">常用句（點一下直接全螢幕）</span>
      <span class="tools">
        <button id="exportBtn" class="mgmt" type="button" title="把常用句存成檔案">匯出</button>
        <button id="importBtn" class="mgmt" type="button" title="從檔案加入常用句">匯入</button>
        <button id="manageBtn" type="button" aria-pressed="false">管理</button>
      </span>
    </div>
    <div class="chips" id="phrases"></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <div id="historyWrap">
    <div class="label"><span>最近說過</span><button id="clearHistBtn" type="button">清空</button></div>
    <div class="chips" id="history"></div>
  </div>

  <div class="hint">
    <span class="kb">Enter 全螢幕 · Shift+Enter 換行 · 全螢幕時點一下或按 Esc 返回</span>
    <span class="touch">按「全螢幕」顯示 · 全螢幕時點一下螢幕返回</span>
  </div>
</main>

<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button" hidden>復原</button></div>

<div id="display" role="button" tabindex="-1" aria-label="點一下返回輸入">
  <p id="text" aria-live="polite"></p>
  <div id="tapHint">點一下返回</div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const input = $('input'), display = $('display'), text = $('text'), tapHint = $('tapHint'), editor = $('editor');
  const phrasesEl = $('phrases'), historyEl = $('history'), phraseWrap = $('phraseWrap');

  // ---------- 儲存（失敗時照常運作，只是不會記住） ----------
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
    // 字串陣列：資料壞掉（不是陣列、混了別的型別）時不要讓整頁掛掉
    getList(key, fallback) {
      const v = store.get(key, null);
      return Array.isArray(v) ? cleanList(v) : fallback;
    }
  };
  // 只留非空白字串、去掉重複
  const cleanList = (arr) => [...new Set(arr.filter((s) => typeof s === 'string' && s.trim()))];

  const DEFAULT_PHRASES = ['請再說一次', '我聽不到', '請等一下', '好', '不用了，謝謝', '謝謝', '請用打字', '在哪裡？', '多少錢？'];
  let phrases = store.getList('phrases', DEFAULT_PHRASES);
  let history = store.getList('history', []).slice(0, 15);
  let flipped = store.get('flipped', false) === true;
  // 全螢幕字級上限：畫面短邊的比例。長句會再自動縮小以塞進畫面。
  const SIZES = { '大': 0.34, '中': 0.24, '小': 0.16 };
  const SIZE_ORDER = ['中', '大', '小'];
  let size = store.get('size', '中');
  if (!(size in SIZES)) size = '中';

  // ---------- 提示列（刪除後可復原） ----------
  const toast = $('toast'), toastMsg = $('toastMsg'), toastUndo = $('toastUndo');
  let toastTimer = null, undoFn = null;
  // 同時只有一則；有 undo 時顯示「復原」並停留 5 秒
  function notify(msg, undo) {
    toastMsg.textContent = msg;
    undoFn = undo || null;
    toastUndo.hidden = !undo;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(closeToast, undo ? 5000 : 2500);
  }
  function closeToast() {
    clearTimeout(toastTimer);
    toast.classList.remove('on');
    undoFn = null;
  }
  toastUndo.addEventListener('click', () => { const f = undoFn; closeToast(); if (f) f(); });

  // ---------- 列表 ----------
  function renderChips(el, items, onPick, onRemove) {
    el.innerHTML = '';
    if (!items.length) {
      const e = document.createElement('div');
      e.className = 'empty'; e.textContent = '（還沒有）';
      el.appendChild(e); return;
    }
    items.forEach((t, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.dataset.i = i; b.title = t;
      const label = document.createElement('span');
      label.className = 't'; label.textContent = t.replace(/\n/g, ' ');
      b.appendChild(label);
      if (onRemove) {
        const x = document.createElement('span');
        x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-hidden', 'true');
        b.appendChild(x);
      }
      b.addEventListener('click', (e) => {
        if (onRemove && phraseWrap.classList.contains('managing')) {
          if (e.target.classList.contains('x')) onRemove(i);
        } else onPick(t);
      });
      el.appendChild(b);
    });
  }
  // focusIndex：重新渲染後把焦點放回這一句（鍵盤操作時不要掉焦點）
  function renderPhrases(focusIndex) {
    renderChips(phrasesEl, phrases, show, (i) => removePhrase(i));
    if (focusIndex != null) {
      const chip = phrasesEl.querySelectorAll('.chip')[focusIndex];
      if (chip) chip.focus(); else $('manageBtn').focus();
    }
  }
  const short = (t) => { t = t.replace(/\s+/g, ' '); return t.length > 12 ? t.slice(0, 12) + '…' : t; };
  function removePhrase(i, refocus) {
    const [removed] = phrases.splice(i, 1);
    store.set('phrases', phrases);
    renderPhrases(refocus ? Math.min(i, phrases.length - 1) : null);
    notify(`已刪除「${short(removed)}」`, () => {
      phrases = phrases.filter((p) => p !== removed);
      phrases.splice(Math.min(i, phrases.length), 0, removed);
      store.set('phrases', phrases);
      renderPhrases();
    });
  }
  // 鍵盤（管理模式）：Delete／Backspace 刪除，Alt+方向鍵移動
  phrasesEl.addEventListener('keydown', (e) => {
    if (!phraseWrap.classList.contains('managing')) return;
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const i = +chip.dataset.i;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removePhrase(i, true); return; }
    const d = e.altKey && { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[e.key];
    if (!d) return;
    e.preventDefault();
    const j = i + d;
    if (j < 0 || j >= phrases.length) return;
    [phrases[i], phrases[j]] = [phrases[j], phrases[i]];
    store.set('phrases', phrases);
    renderPhrases(j);
  });
  // ---------- 拖曳排序（管理模式） ----------
  let drag = null;
  phrasesEl.addEventListener('pointerdown', (e) => {
    if (!phraseWrap.classList.contains('managing')) return;
    const chip = e.target.closest('.chip');
    if (!chip || e.target.classList.contains('x')) return;
    drag = { chip, x: e.clientX, y: e.clientY, id: e.pointerId, moved: false };
    chip.setPointerCapture(e.pointerId);
  });
  phrasesEl.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      drag.moved = true;
      drag.chip.classList.add('dragging');
    }
    e.preventDefault();
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const over = hit && hit.closest('.chip');
    if (!over || over === drag.chip || over.parentNode !== phrasesEl) return;
    const r = over.getBoundingClientRect();
    const before = e.clientX < r.left + r.width / 2;
    phrasesEl.insertBefore(drag.chip, before ? over : over.nextSibling);
  });
  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const { chip, moved } = drag;
    drag = null;
    chip.classList.remove('dragging');
    if (!moved) return;
    phrases = [...phrasesEl.querySelectorAll('.chip')].map((c) => phrases[+c.dataset.i]);
    store.set('phrases', phrases);
    renderPhrases();
  }
  phrasesEl.addEventListener('pointerup', endDrag);
  phrasesEl.addEventListener('pointercancel', endDrag);

  function renderHistory() {
    renderChips(historyEl, history, show);
  }
  function addHistory(t) {
    history = [t, ...history.filter((h) => h !== t)].slice(0, 15);
    store.set('history', history);
    renderHistory();
  }

  // ---------- 自動放到最大 ----------
  function fit() {
    if (!display.classList.contains('show')) return;
    display.classList.remove('overflow');
    const pad = Math.max(16, Math.min(display.clientWidth, display.clientHeight) * 0.04);
    const W = display.clientWidth - pad * 2;
    const H = display.clientHeight - pad * 2;
    text.style.width = W + 'px';
    const cap = Math.max(24, Math.min(W, H) * SIZES[size]);
    let lo = 10, hi = cap;
    for (let n = 0; n < 24 && hi - lo > 0.5; n++) {
      const mid = (lo + hi) / 2;
      text.style.fontSize = mid + 'px';
      if (text.scrollWidth <= W + 0.5 && text.scrollHeight <= H + 0.5) lo = mid; else hi = mid;
    }
    text.style.fontSize = Math.floor(lo) + 'px';
    if (Math.floor(lo) >= Math.floor(cap) - 1) {
      // 到上限時再確認一次放得下
      text.style.fontSize = Math.floor(cap) + 'px';
      if (text.scrollWidth > W + 0.5 || text.scrollHeight > H + 0.5) text.style.fontSize = Math.floor(lo) + 'px';
    }
    // 最小字級還是放不下：改成可以捲動
    display.classList.toggle('overflow', text.scrollWidth > W + 0.5 || text.scrollHeight > H + 0.5);
  }
  // 視窗大小、旋轉、字型晚到（霞鶩文楷是分段載入）都要重算，同一個畫格只算一次
  let fitFrame = 0;
  const scheduleFit = () => {
    if (fitFrame) return;
    fitFrame = requestAnimationFrame(() => { fitFrame = 0; fit(); });
  };

  // ---------- 螢幕常亮 ----------
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  }
  function releaseAwake() {
    try { wakeLock && wakeLock.release(); } catch {}
    wakeLock = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && display.classList.contains('show')) keepAwake();
  });

  // ---------- 顯示 / 返回 ----------
  let hintTimer = null, enteredFullscreen = false, shownAt = 0;
  // 剛進入全螢幕的短時間內忽略「返回」，避免送出時的連點／同一個按鍵穿透，或對面的人誤觸
  const IGNORE_MS = 400;
  const justShown = () => Date.now() - shownAt < IGNORE_MS;

  function show(t) {
    t = (t ?? input.value).trim();
    if (!t) { input.focus(); return; }
    shownAt = Date.now();
    text.textContent = t;
    display.classList.toggle('flip', flipped);
    display.classList.add('show');
    input.blur();
    // 全螢幕時，底下的輸入畫面不能被 Tab 聚焦或被讀屏讀到
    editor.inert = true;
    try { display.focus({ preventScroll: true }); } catch {}
    addHistory(t);

    const root = document.documentElement;
    if (root.requestFullscreen && !document.fullscreenElement) {
      root.requestFullscreen({ navigationUI: 'hide' })
        .then(() => {
          // 進入全螢幕之前就已經按 Esc 返回了：不要卡在全螢幕
          if (!display.classList.contains('show')) document.exitFullscreen().catch(() => {});
          else enteredFullscreen = true;
        })
        .catch(() => {});
    }
    keepAwake();

    tapHint.classList.remove('gone');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => tapHint.classList.add('gone'), 1800);

    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  }

  function hide() {
    if (!display.classList.contains('show')) return;
    display.classList.remove('show', 'overflow');
    editor.inert = false;
    releaseAwake();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    enteredFullscreen = false;
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }

  display.addEventListener('click', () => { if (!justShown()) hide(); });
  document.addEventListener('fullscreenchange', () => {
    // 使用者用 Esc / 系統手勢離開全螢幕時，一起回到輸入畫面
    if (!document.fullscreenElement && enteredFullscreen) hide();
  });
  if ('ResizeObserver' in window) new ResizeObserver(scheduleFit).observe(display, { box: 'border-box' });
  else window.addEventListener('resize', scheduleFit);
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', scheduleFit);

  // ---------- 鍵盤 ----------
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      show();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (!display.classList.contains('show')) return;
    if (e.key === 'Escape') { e.preventDefault(); hide(); }
    else if ((e.key === 'Enter' || e.key === ' ') && !e.repeat && !justShown()) { e.preventDefault(); hide(); }
  });

  // ---------- 草稿（重新整理或分頁被回收後還原） ----------
  input.value = store.get('draft', '');
  let draftTimer = null;
  const saveDraft = () => { clearTimeout(draftTimer); store.set('draft', input.value); };
  input.addEventListener('input', () => { clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 300); });
  window.addEventListener('pagehide', saveDraft);

  // ---------- 按鈕 ----------
  $('showBtn').addEventListener('click', () => show());
  $('clearBtn').addEventListener('click', () => { input.value = ''; saveDraft(); input.focus(); });
  const saveBtn = $('saveBtn');
  let savedTimer = null;
  saveBtn.addEventListener('click', () => {
    const t = input.value.trim();
    if (!t) { input.focus(); return; }
    phrases = [t, ...phrases.filter((p) => p !== t)];
    store.set('phrases', phrases);
    renderPhrases();
    phrasesEl.scrollLeft = 0;
    // 回饋：新加入的句子在最左邊
    saveBtn.textContent = '已加入 ✓';
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => { saveBtn.textContent = '＋常用'; }, 1200);
  });
  const flipBtn = $('flipBtn');
  const syncFlip = () => {
    flipBtn.classList.toggle('on', flipped);
    flipBtn.setAttribute('aria-pressed', String(flipped));
    flipBtn.textContent = flipped ? '翻轉：開' : '翻轉';
  };
  flipBtn.addEventListener('click', () => { flipped = !flipped; store.set('flipped', flipped); syncFlip(); });
  const sizeBtn = $('sizeBtn');
  const syncSize = () => { sizeBtn.textContent = '字級：' + size; };
  sizeBtn.addEventListener('click', () => {
    size = SIZE_ORDER[(SIZE_ORDER.indexOf(size) + 1) % SIZE_ORDER.length];
    store.set('size', size); syncSize();
  });
  $('manageBtn').addEventListener('click', (e) => {
    const on = phraseWrap.classList.toggle('managing');
    e.currentTarget.textContent = on ? '完成' : '管理';
    e.currentTarget.classList.toggle('on', on);
    e.currentTarget.setAttribute('aria-pressed', String(on));
    // 固定字串，用 innerHTML 是為了「只給鍵盤看」的說明
    $('phraseLabel').innerHTML = on
      ? '拖曳排序<span class="kb">（或 Alt+←→）</span> · 點 × 刪除'
      : '常用句（點一下直接全螢幕）';
  });
  $('clearHistBtn').addEventListener('click', () => {
    if (!history.length) return;
    const prev = history;
    history = []; store.set('history', history); renderHistory();
    notify('已清空最近說過', () => {
      history = cleanList([...history, ...prev]).slice(0, 15);
      store.set('history', history); renderHistory();
    });
  });

  // ---------- 匯出／匯入常用句 ----------
  $('exportBtn').addEventListener('click', () => {
    const json = JSON.stringify({ app: 'kan-wo-shuo', version: 1, phrases }, null, 2) + '\n';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = '看我說-常用句.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  const importFile = $('importFile');
  $('importBtn').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', async () => {
    const file = importFile.files[0];
    importFile.value = '';   // 同一個檔案可以再選一次
    if (!file) return;
    // 接受 { phrases: [...] }（本頁匯出的格式）或直接是字串陣列
    let list = null;
    try {
      if (file.size > 1e6) throw new Error('too large');
      const data = JSON.parse(await file.text());
      const arr = Array.isArray(data) ? data : data && data.phrases;
      if (Array.isArray(arr)) list = cleanList(arr.map((s) => (typeof s === 'string' ? s.trim() : s)));
    } catch {}
    if (!list) { notify('檔案格式不對，沒有匯入'); return; }
    const added = list.filter((p) => !phrases.includes(p));
    phrases = [...phrases, ...added];
    store.set('phrases', phrases); renderPhrases();
    notify(added.length ? `已匯入 ${added.length} 句` : '沒有新的句子');
  });

  renderPhrases();
  renderHistory();
  syncFlip();
  syncSize();

  // ---------- 離線：註冊 service worker（file:// 或不支援時安靜略過） ----------
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
